<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Конвертер валют і одиниць</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="js/script.js" defer></script>
</head>

<body>
	<header class="site-header">
		<h1>Конвертер валют і одиниць виміру</h1>
	</header>

	<main class="layout">
		<section class="converter-card">
			<h2>Вибір типу конвертації</h2>
			<div class="radio-group">
				<div class="radio-item">
					<input type="radio" id="type-currency" name="conv-type" checked>
					<label for="type-currency">Валюти</label>
				</div>
				<div class="radio-item">
					<input type="radio" id="type-length" name="conv-type">
					<label for="type-length">Довжина</label>
				</div>
				<div class="radio-item">
					<input type="radio" id="type-weight" name="conv-type">
					<label for="type-weight">Вага</label>
				</div>
			</div>
		</section>

		<section class="converter-card">
			<h2>Форма конвертації</h2>
			
			<form id="converter-form">
				<div class="form-group">
					<label for="amount-input">Введіть значення:</label>
					<input type="number" id="amount-input" name="amount" min="0.01" step="0.01" required>
				</div>

				<div class="exchange-group">
					<div class="currency-field">
						<label for="from-currency">З валюти:</label>
						<select id="from-currency" name="from-currency">
							<option value="usd">USD</option>
							<option value="eur">EUR</option>
							<option value="uah">UAH</option>
						</select>
					</div>

					<button type="button" class="swap-btn" aria-label="Поміняти місцями">⇅</button>

					<div class="currency-field">
						<label for="to-currency">У валюту:</label>
						<select id="to-currency" name="to-currency">
							<option value="uah">UAH</option>
							<option value="usd">USD</option>
							<option value="eur">EUR</option>
						</select>
					</div>
				</div>

				<button type="submit" class="convert-btn">Конвертувати</button>
			</form>

			<p class="result-box">Результат: <span id="result">0</span></p>
		</section>

		<section class="converter-card">
			<h2>Історія конвертацій</h2>
			<ul id="history-list"></ul>
		</section>

		<section class="converter-card">
			<h2>Курси валют</h2>
			<div class="rates-controls">
				<p id="rates-meta">Базова валюта: -, дата: -</p>
				<button type="button" id="refresh-btn" class="refresh-btn">Оновити</button>
			</div>
			<p id="loading-status" class="status-text" hidden>Завантаження...</p>
			<p id="error-message" class="error-text" hidden></p>
			<ul id="rates-list">
				<li>USD: 1</li>
			</ul>
			<p id="rates-count">Кількість валют у списку: 0</p>
		</section>
	</main>

	<footer>
		<p>Примітка: курс валют є орієнтовним. &copy; 2026</p>
	</footer>
</body>

</html>
